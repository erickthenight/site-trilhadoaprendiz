<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Trilha do Aprendiz: Inovação e Impacto Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: { extend: { colors: { 'blue-ta': '#0056b3', 'orange-ta': '#f7991e', 'dark-ta': '#1a1a1a', 'dark-card': '#2f2f2f', 'green-ta': '#4CAF50' } } }
        }
    </script>
</head>
<body class="bg-dark-ta text-white font-inter">

    <header class="bg-orange-ta sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <img src="imagens/logo-trilha-do-aprendiz-AZUL.png" class="h-10">
            <nav class="hidden md:flex gap-6 items-center">
                <a href="index.html" data-i18n="nav_inicio">Início</a>
                <a href="/metaporto" class="bg-blue-ta px-4 py-2 rounded-full font-bold text-sm">MetaPorto.XR</a>
                <div class="flex gap-2 bg-black-ta/20 p-1 rounded">
                    <button onclick="changeLanguage('pt')" class="hover:bg-white/20 px-2 rounded">🇧🇷</button>
                    <button onclick="changeLanguage('en')" class="hover:bg-white/20 px-2 rounded">🇺🇸</button>
                    <button onclick="changeLanguage('zh')" class="hover:bg-white/20 px-2 rounded">🇨🇳</button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="py-16 bg-[#111111]">
            <div class="max-w-6xl mx-auto px-4 grid md:grid-cols-2 gap-12 items-center">
                <img src="assets/11_capa_do_simulador_MetaPorto.png" class="rounded-xl border border-gray-800">
                <div>
                    <h2 data-i18n="meta_title" class="text-3xl font-bold mb-4 text-orange-ta">MetaPorto: Solução Industrial</h2>
                    <p data-i18n="meta_desc" class="text-gray-400 mb-6">Parceria YAKAMI TECH & Trilha: Treinamento XR com validação Blockchain.</p>
                    <a href="/metaporto" data-i18n="meta_btn" class="bg-blue-ta px-8 py-3 rounded-full font-bold">Conheça o Produto</a>
                </div>
            </div>
        </section>
        
        </main>

    <script>
        const translations = {
            pt: { title: "Trilha do Aprendiz", nav_inicio: "Início", meta_title: "MetaPorto: Infraestrutura Industrial", meta_desc: "Simulação VR para compliance portuário global.", meta_btn: "Conheça o Produto" },
            en: { title: "Trilha do Aprendiz", nav_inicio: "Home", meta_title: "MetaPorto: Industrial Infrastructure", meta_desc: "VR simulation for global port compliance.", meta_btn: "Discover Product" },
            zh: { title: "学徒之路", nav_inicio: "主页", meta_title: "MetaPorto: 工业基础设施", meta_desc: "用于全球港口合规的 VR 模拟。", meta_btn: "了解产品" }
        };
        function changeLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
        }
    </script>
</body>
</html>
